[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roadeye"
version = "0.1.0"
description = "Smartphone-based road inspection: survey ingest, defect detection, geolocation and municipal reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Core dependencies are deliberately minimal. Everything needed to ingest a survey,
# geolocate observations, deduplicate them into defects, store and export them runs
# with just this. No GPU, no ffmpeg, no network. See docs/TECHNOLOGY_EVALUATION.md.
dependencies = [
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
# Real video decoding. Kept optional because ffmpeg is absent on some target machines
# and the pipeline must remain testable there.
video = ["av>=12", "numpy>=1.26"]

# Image-quality scoring beyond the no-op fallback.
quality = ["numpy>=1.26"]

# Baseline detector (M3). torchvision is BSD-3-Clause; see docs/LICENSE_AUDIT.md for
# why Ultralytics is deliberately absent from this file and must stay absent.
vision = ["torch>=2.2", "torchvision>=0.17", "numpy>=1.26"]

api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

# Pillow is needed to write the evidence images that make review possible, and
# numpy to read frames. Both arrive with the vision extra too.
review = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pillow>=10", "numpy>=1.26"]

dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    # Lint and type-check versions are bounded, not open-ended. Both add new rules in
    # ordinary releases, so `>=0.4` meant CI could turn red on a morning when nobody
    # changed anything — and a build that fails for reasons unrelated to the change is a
    # build people learn to ignore. Bump these deliberately, in their own commit, so the
    # new findings are read rather than skipped past.
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
    # fastapi's TestClient needs an HTTP client to drive the app in-process.
    "httpx",
]

[project.scripts]
roadeye = "roadeye.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." puts the repo root on the path so services/ (not an installed package) is
# importable by tests without an env var.
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    # Anything needing a GPU, real model weights, ffmpeg or the network. Excluded from
    # the default run so `pytest` always passes on a bare laptop.
    "slow: requires real models, video files or large datasets",
    "requires_video: requires ffmpeg/PyAV and a real video file",
    "requires_torch: requires torch/torchvision",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI's Depends() idiom relies on calls in defaults
    # UP042 wants `StrEnum` instead of `(str, Enum)`. Declined deliberately: these enum
    # values are persisted in SQLite and written into CSV/GeoJSON exports, and the two
    # base classes differ in what `str(Member)` returns. `(str, Enum)` is the
    # well-understood pattern here and changing it risks the serialised contract for a
    # purely cosmetic gain.
    "UP042",
]

[tool.mypy]
# `python_version` is deliberately NOT pinned to 3.11.
#
# It was, and CI's first run found what that costs. mypy applies the target version to
# every file it parses, including third-party stubs — and numpy 2.5's `__init__.pyi` uses
# a PEP 695 `type` statement, so mypy pinned to 3.11 rejects numpy's own stub and stops:
#
#   numpy/__init__.pyi:737: error: Type statement is only supported in Python 3.12 and
#   greater  [syntax]
#
# Without the pin mypy follows the interpreter, and the floor is still enforced — better
# than before, in fact. CI runs the tests on 3.11, where 3.12+ syntax is an ImportError
# at collection, which is a harder failure than a type error and arrives sooner.
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# ml/ and services/ are checked too. They were outside this list until 2026-08-22, which
# is exactly why twelve type errors accumulated in the training script unnoticed — the
# one file a new machine runs first. Code that is not in this list is not type-checked.
files = ["src/roadeye", "ml", "services", "scripts"]
explicit_package_bases = true
mypy_path = "src"
